name: Import Make It Home source
on:
  push:
    paths:
      - .github/workflows/import-project.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and expand the reviewed release archive
        run: |
          python - <<'PY'
          import hashlib, pathlib, zipfile
          root = pathlib.Path.cwd()
          archive = root / 'make-it-home-v1.0.0-github.zip'
          expected = '3dcb7fa83598813d82c6e800af77620001496684ad2505a6ec148dc03efaeb35'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected, 'Archive checksum mismatch'
          count = 0
          with zipfile.ZipFile(archive) as z:
              for entry in z.infolist():
                  if entry.is_dir():
                      continue
                  parts = pathlib.PurePosixPath(entry.filename).parts
                  assert parts[0] == 'make-it-home' and '..' not in parts
                  relative = pathlib.Path(*parts[1:])
                  assert relative.parts[0] not in ('.git', '.local', 'node_modules', 'local-ai', 'output', 'test-results')
                  if relative.parts[0] == '.github':
                      continue
                  target = root / relative
                  assert target.resolve().is_relative_to(root.resolve())
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(entry))
                  count += 1
          assert count == 242, count
          archive.unlink()
          print(f'Expanded {count} reviewed files. CI workflow is added separately through the web UI.')
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check:release
      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Publish verified Make It Home source, demo and documentation'
          git push origin HEAD:main
